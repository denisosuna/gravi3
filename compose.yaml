services:
  app:
    build: .
    ports:
      - '${GRAVI3_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
